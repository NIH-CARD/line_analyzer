[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proteomics-revertant"
version = "0.1.0"
description = "Allele-dosage differential abundance for CRISPR edit/revertant clone panels"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
dev = ["ruff>=0.6"]

[tool.setuptools]
packages = ["proteomics_revertant"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines are mostly prose in docstrings
    "B905",   # zip(strict=) needs 3.10
]

[tool.ruff.lint.per-file-ignores]
"proteomics_revertant/tests.py" = ["B011", "F401"]
